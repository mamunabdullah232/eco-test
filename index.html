<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Xohopathi | Your Digital Companion</title>
<meta name="description" content="Xohopathi provides teacher links, student resources, mock tests, study materials, question papers, and educational contact details." />
<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --green:#15803d;
  --teal:#0f766e;
  --orange:#c2410c;
  --rose:#be123c;
  --violet:#6d28d9;
  --ink:#0f172a;
  --text:#1f2937;
  --muted:#64748b;
  --bg:#f8fafc;
  --surface:#ffffff;
  --border:#e2e8f0;
  --shadow:0 14px 30px rgba(15,23,42,.08);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#f8fafc 0%,#eef6ff 32%,#fff7ed 68%,#ecfdf5 100%);
  color:var(--text);
  line-height:1.6;
}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.container{width:min(1140px,92%);margin:0 auto}
.skip-link{
  position:absolute;
  left:16px;
  top:-80px;
  z-index:2000;
  background:var(--ink);
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  font-weight:800;
}
.skip-link:focus{top:16px}
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.navbar{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:max-content;
}
.logo-mark{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--blue),var(--teal));
  color:#fff;
  display:grid;
  place-items:center;
  font-family:"Nirmala UI","Noto Sans Bengali",Arial,sans-serif;
  font-size:1.55rem;
  font-weight:900;
  box-shadow:0 10px 22px rgba(37,99,235,.22);
}
.logo-text{display:flex;flex-direction:column;line-height:1.08}
.logo-text strong{
  color:var(--ink);
  font-size:1.34rem;
  font-weight:900;
  letter-spacing:-.03em;
}
.logo-text small{
  color:var(--muted);
  font-size:.78rem;
  font-weight:800;
  margin-top:4px;
}
.bi{
  display:inline-flex;
  flex-direction:column;
  gap:1px;
  line-height:1.18;
}
.as{
  color:var(--muted);
  font-size:.82em;
  font-weight:800;
}
nav{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.9rem;
  font-weight:900;
}
.nav-link{
  --accent:var(--blue);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:8px 12px;
  border-radius:12px;
  border:1px solid color-mix(in srgb, var(--accent) 22%, white);
  color:var(--accent);
  background:color-mix(in srgb, var(--accent) 10%, white);
}
.nav-link.home{--accent:var(--blue)}
.nav-link.teacher{--accent:var(--green)}
.nav-link.students{--accent:var(--orange)}
.nav-link.mock{--accent:var(--rose)}
.nav-link.materials{--accent:var(--teal)}
.nav-link.contact{--accent:var(--violet)}
.nav-link.student-login{--accent:#0891b2}
.nav-link.admin-login{--accent:#7c3aed}
.new-blink{
  display:inline-flex;
  align-items:center;
  margin-left:8px;
  padding:3px 8px;
  border-radius:999px;
  background:#ef4444;
  color:#fff;
  font-size:.72rem;
  font-weight:900;
  animation:newBlink 1s infinite;
}
@keyframes newBlink{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.94)}
}
.nav-link:hover,
.nav-link:focus,
.nav-link.active{
  color:var(--accent);
  background:color-mix(in srgb, var(--accent) 10%, white);
  border-color:color-mix(in srgb, var(--accent) 25%, white);
}
main{
  min-height:calc(100vh - 76px);
  padding:36px 0 44px;
}
.page-view{display:block}
.page-view[hidden]{display:none}
.section-head{
  max-width:760px;
  margin:0 auto 30px;
  text-align:center;
}
.mini{
  color:var(--blue);
  font-size:.82rem;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:7px;
}
.section-head h1,
.section-head h2{
  color:var(--ink);
  font-size:clamp(1.75rem,3.4vw,2.65rem);
  line-height:1.15;
  letter-spacing:-.035em;
  margin-bottom:8px;
}
.section-head p{color:var(--muted);font-size:1rem}
.home-shell{
  display:grid;
  align-items:start;
  min-height:calc(100vh - 170px);
}
.result-portal{
  width:100%;
  display:grid;
  gap:18px;
}
.result-programs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.result-program{
  appearance:none;
  border:1px solid #dbe4ef;
  border-radius:14px;
  padding:18px;
  text-align:left;
  background:#fff;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(15,23,42,.055);
  font:inherit;
}
.result-program:hover,
.result-program.active{
  border-color:var(--blue);
  background:#f8fbff;
}
.result-program strong{
  display:block;
  color:var(--ink);
  font-size:1.06rem;
  line-height:1.25;
}
.result-program span{
  display:block;
  color:var(--muted);
  font-size:.89rem;
  margin-top:5px;
}
.result-panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:0 10px 25px rgba(15,23,42,.06);
}
.result-panel-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}
.result-panel-head h2{
  color:var(--ink);
  font-size:1.35rem;
  line-height:1.2;
}
.result-panel-head p{
  color:var(--muted);
  font-size:.93rem;
  margin-top:4px;
}
.result-form{
  display:grid;
  grid-template-columns:1.4fr .7fr auto;
  gap:12px;
  align-items:end;
}
.result-field{
  display:grid;
  gap:6px;
  color:#334155;
  font-size:.88rem;
  font-weight:900;
}
.result-field select,
.result-field input{
  width:100%;
  min-height:48px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  padding:0 12px;
  color:var(--ink);
  background:#fff;
  font:inherit;
  font-weight:700;
}
.result-field[hidden]{display:none}
.result-submit,
.result-print,
.result-reset{
  min-height:48px;
  border:0;
  border-radius:11px;
  padding:0 16px;
  font:inherit;
  font-weight:900;
  cursor:pointer;
}
.result-submit{
  background:var(--blue);
  color:#fff;
}
.result-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}
.result-actions[hidden]{display:none}
.result-print{
  background:#0f766e;
  color:#fff;
}
.result-reset{
  background:#f1f5f9;
  color:#334155;
  border:1px solid #cbd5e1;
}
.result-message{
  margin-top:12px;
  color:#be123c;
  font-size:.92rem;
  font-weight:800;
}
.marksheet{
  margin-top:22px;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 14px 32px rgba(15,23,42,.08);
}
.marksheet[hidden]{display:none}
.marksheet-header{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:18px;
  align-items:center;
  padding:24px;
  background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 56%,#0f766e 100%);
  color:#fff;
}
.marksheet-logo{
  width:66px;
  height:66px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:4px double rgba(255,255,255,.85);
  font-weight:900;
  font-size:1.25rem;
}
.marksheet-title h2{
  font-size:1.4rem;
  line-height:1.15;
  letter-spacing:0;
}
.marksheet-title p{
  color:#dbeafe;
  font-size:.92rem;
  margin-top:4px;
}
.marksheet-badge{
  display:grid;
  gap:3px;
  text-align:right;
  font-size:.8rem;
  font-weight:900;
}
.marksheet-badge span{
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.14);
}
.marksheet-body{
  padding:22px;
  display:grid;
  gap:18px;
}
.student-grid,
.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
.info-box,
.stat-box{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:12px;
  background:#f8fafc;
}
.info-box span,
.stat-box span{
  display:block;
  color:#64748b;
  font-size:.76rem;
  font-weight:900;
  text-transform:uppercase;
}
.info-box strong,
.stat-box strong{
  display:block;
  color:var(--ink);
  margin-top:4px;
  font-size:1.02rem;
  line-height:1.2;
}
.stat-box strong{font-size:1.18rem}
.marks-table-wrap{overflow-x:auto}
.marks-table{
  width:100%;
  min-width:720px;
  border-collapse:collapse;
  border:1px solid #cbd5e1;
  border-radius:12px;
  overflow:hidden;
}
.marks-table th,
.marks-table td{
  padding:12px 11px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
  vertical-align:middle;
}
.marks-table th{
  background:#eff6ff;
  color:#1e3a8a;
  font-size:.82rem;
  text-transform:uppercase;
  letter-spacing:0;
}
.marks-table td{
  color:#334155;
  font-weight:700;
}
.marks-table tbody tr + tr td{
  border-top:3px solid #eef2f7;
}
.marks-table tr.published td{
  background:#ecfdf5;
  color:#064e3b;
  border-bottom-color:#bbf7d0;
}
.marks-table tr.published td:nth-child(2){
  color:#047857;
  font-weight:900;
}
.marks-table tr.published td:nth-child(3){
  color:#1d4ed8;
  font-size:1.04rem;
  font-weight:900;
}
.marks-table tr.published td:nth-child(5),
.marks-table tr.published td:nth-child(6){
  color:#0f766e;
  font-weight:900;
}
.marks-table td:nth-child(3),
.marks-table td:nth-child(4),
.marks-table td:nth-child(5){
  text-align:right;
}
.marks-table tr.pending td{
  color:#64748b;
  background:#f8fafc;
}
.marksheet-foot{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  padding-top:10px;
  color:#475569;
  font-size:.9rem;
}
.signature-line{
  margin-top:32px;
  padding-top:8px;
  border-top:1px solid #94a3b8;
  text-align:center;
  color:#334155;
  font-weight:900;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:0 8px 22px rgba(15,23,42,.055);
}
.card-mark{
  width:44px;
  height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:#dbeafe;
  color:var(--blue-dark);
  font-weight:900;
  margin-bottom:13px;
}
.card h3{
  color:var(--ink);
  font-size:1.14rem;
  line-height:1.25;
  margin-bottom:7px;
}
.card p{
  color:var(--muted);
  font-size:.95rem;
  margin-bottom:13px;
}
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:28px;
  padding:5px 10px;
  border-radius:999px;
  background:#eff6ff;
  color:var(--blue-dark);
  font-size:.78rem;
  font-weight:900;
}
.badge.green{background:#dcfce7;color:#166534}
.badge.amber{background:#ffedd5;color:#9a3412}
.resource-layout{max-width:760px;margin:0 auto}
.resource-list{display:grid;gap:12px}
.resource-row{
  display:grid;
  grid-template-columns:44px 1fr auto;
  gap:12px;
  align-items:center;
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  box-shadow:0 8px 20px rgba(15,23,42,.045);
}
.resource-row:nth-child(1) .resource-mark{background:#fee2e2;color:#991b1b}
.resource-row:nth-child(2) .resource-mark{background:#dbeafe;color:#1d4ed8}
.resource-row:nth-child(3) .resource-mark{background:#dcfce7;color:#166534}
.resource-row:nth-child(4) .resource-mark{background:#fef3c7;color:#92400e}
.resource-row:nth-child(5) .resource-mark{background:#ede9fe;color:#5b21b6}
.resource-row:nth-child(6) .resource-mark{background:#ccfbf1;color:#0f766e}
.resource-row:nth-child(7) .resource-mark{background:#fce7f3;color:#be185d}
.resource-row:hover{
  border-color:var(--blue);
  background:#f8fbff;
}
.routine-launch{
  width:100%;
  appearance:none;
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
}
.resource-row.disabled{
  cursor:default;
  background:#fff;
}
.resource-row.disabled:hover{
  border-color:var(--border);
  background:#fff;
}
.resource-row strong{
  color:var(--ink);
  display:block;
  line-height:1.25;
}
.resource-row small{
  color:var(--muted);
  display:block;
  margin-top:3px;
}
.resource-mark{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:#f1f5f9;
  color:#334155;
  font-size:.78rem;
  font-weight:900;
}
.routine-modal[hidden]{display:none}
.routine-modal{
  position:fixed;
  inset:0;
  z-index:1400;
  display:grid;
  place-items:center;
  padding:18px;
  background:rgba(15,23,42,.68);
}
.routine-dialog{
  width:min(1140px,100%);
  max-height:min(92vh,880px);
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 28px 70px rgba(15,23,42,.3);
}
.routine-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:18px;
}
.routine-head h2{
  color:var(--ink);
  font-size:clamp(1.32rem,2.7vw,1.8rem);
  line-height:1.22;
}
.routine-head p{
  color:var(--muted);
  font-size:.91rem;
  margin-top:5px;
}
.routine-close{
  flex:0 0 42px;
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  color:var(--ink);
  cursor:pointer;
  font-size:1.55rem;
  line-height:1;
}
.routine-close:hover{background:#f1f5f9}
.routine-modes{
  display:inline-flex;
  gap:4px;
  margin-bottom:16px;
  padding:4px;
  border-radius:11px;
  background:#e2e8f0;
}
.routine-mode{
  min-height:42px;
  border:0;
  border-radius:8px;
  padding:0 16px;
  background:transparent;
  color:#475569;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}
.routine-mode.active{
  background:#fff;
  color:var(--blue-dark);
  box-shadow:0 2px 8px rgba(15,23,42,.08);
}
.routine-controls{
  display:flex;
  align-items:flex-end;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.routine-field{
  display:grid;
  gap:6px;
  min-width:min(270px,100%);
  color:#334155;
  font-size:.88rem;
  font-weight:800;
}
.routine-field select{
  width:100%;
  min-height:46px;
  padding:0 12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font:inherit;
  font-weight:700;
}
.routine-field[hidden]{display:none}
.routine-legend{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
  margin:4px 0 16px;
  color:#475569;
  font-size:.87rem;
  font-weight:700;
}
.routine-key{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.routine-dot{
  width:12px;
  height:12px;
  border-radius:50%;
}
.routine-dot.past{background:#ef4444}
