<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>AI Knowledge Base | Xohopathi</title>
  <style>
    :root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#dbe4f0;--ok:#15803d;--danger:#b91c1c;--bg:#f1f5f9}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}
    header{padding:18px 22px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    h1,h2{margin:0}h1{font-size:1.25rem}h2{font-size:1.05rem}.muted{color:var(--muted)}
    main{max-width:1120px;margin:0 auto;padding:26px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.7fr);gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 26px rgba(15,23,42,.06)}.span-all{grid-column:1/-1}
    label{display:grid;gap:7px;font-weight:800;color:#334155}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;background:white;color:var(--ink)}textarea{min-height:94px;resize:vertical}.answer{min-height:150px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stack{display:grid;gap:14px}.actions,.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top-actions{justify-content:space-between}
    .btn{display:inline-block;border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:white;text-decoration:none;font-weight:800;cursor:pointer}.btn.secondary{background:#e2e8f0;color:var(--ink)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}
    #status{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc;color:var(--muted)}#status.ok{background:#f0fdf4;color:var(--ok)}#status.error{background:#fef2f2;color:var(--danger)}
    .upload{border:2px dashed #bfdbfe;border-radius:14px;padding:16px;background:#eff6ff}.upload input{margin-top:9px}.record-grid{display:grid;gap:10px;margin-top:14px}.record{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.record strong{display:block;margin-bottom:5px}.record p{margin:0 0 9px;color:#334155;white-space:pre-line}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-bottom:10px}.pill{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:3px 8px}
    @media(max-width:840px){main{grid-template-columns:1fr}.split{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div><h1>AI Knowledge Base</h1><div class="muted" id="adminInfo">Checking admin access...</div></div><div class="actions"><a class="btn secondary" href="./admin-dashboard.html">Dashboard</a><a class="btn secondary" href="./xohopathi-ai.html">Xohopathi AI</a></div></header>
  <main>
    <section class="panel">
      <div class="top-actions"><h2>Approved Answer</h2><button class="btn secondary" id="clearBtn" type="button">Clear</button></div>
      <form class="stack" id="recordForm">
        <input id="recordId" type="hidden" />
        <label>Question<textarea id="questionInput" maxlength="260" required disabled></textarea></label>
        <label>Approved answer<textarea class="answer" id="answerInput" maxlength="2000" required disabled></textarea></label>
        <div class="split"><label>Category<input id="categoryInput" maxlength="80" disabled /></label><label>Tags<input id="tagsInput" maxlength="240" placeholder="comma separated" disabled /></label></div>
        <label>Aliases<textarea id="aliasesInput" maxlength="600" placeholder="one per line or comma separated" disabled></textarea></label>
        <div class="actions"><button class="btn" id="saveBtn" type="submit" disabled>Save approved answer</button></div>
      </form>
      <div id="status" role="status">Waiting for admin sign-in...</div>
    </section>
    <section class="panel">
      <h2>JSON Import</h2>
      <p class="muted">Import replaces the current approved knowledge records.</p>
      <div class="upload"><strong>Knowledge-base JSON</strong><input id="fileInput" type="file" accept="application/json,.json" disabled /></div>
      <div class="actions" style="margin-top:14px"><button class="btn" id="importBtn" type="button" disabled>Import records</button><button class="btn secondary" id="refreshBtn" type="button" disabled>Refresh</button></div>
    </section>
    <section class="panel span-all">
      <div class="top-actions"><div><h2>Approved Records</h2><div class="muted" id="recordCount">No records loaded.</div></div></div>
      <div class="record-grid" id="recordsArea">Loading...</div>
    </section>
  </main>
  <script type="module" src="./admin-knowledge-base.js"></script>
</body>
</html>
